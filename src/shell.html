<title>Tablewise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500&display=swap">
<style>
/*STYLE*/
</style>

<div class="loading" id="loading">Opening your database…</div>
<div id="app">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Show or hide the side panel" title="Show or hide the side panel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="brand"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="3.5" width="19" height="17" rx="3" stroke="var(--accent)" stroke-width="2"/><path d="M2.5 9.5h19M9 9.5v11" stroke="var(--accent)" stroke-width="2"/><circle cx="15.5" cy="15" r="2" fill="var(--accent)"/></svg><span class="hide-sm">Tablewise</span></div>
    <button class="conn-pill" id="connPill" title="Change database"><span class="dot"></span><span id="connName">…</span><span class="kind" id="connKind"></span></button>
    <span class="ro-badge" id="roBadge" hidden>Read-only</span>
    <div class="spacer"></div>
    <button class="btn ghost sm" id="undoBtn" title="Undo the last change" hidden>Undo</button>
    <button class="btn ghost sm hide-sm" id="tourBtn">Tour</button>
    <label class="switch" id="explainSw"><input type="checkbox" id="explainToggle" aria-label="Explain mode"><span class="hide-sm">Explain on hover</span><span class="show-sm">?</span></label>
    <button class="btn sm" id="aiBtn">Ask AI</button>
    <button class="btn sm" id="guideBtn">Guide</button>
  </header>
  <div class="body">
    <aside class="sidebar" id="sidebar">
      <div class="resizer" id="sideResizer" title="Drag to resize"></div>
      <div class="side-head"><span class="label">Database</span>
        <button class="icon-btn" id="newTableSide" title="Create a new table" aria-label="Create a new table"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon-btn" id="refreshTree" title="Refresh" aria-label="Refresh the list"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button></div>
      <input class="tables-search" id="tableSearch" placeholder="Find a table…" aria-label="Find a table">
      <div class="tree" id="tree"></div>
      <div class="side-foot"><button class="btn sm ghost" id="sideImport">Import a file</button><button class="btn sm ghost" id="sideOpen">Open another database</button></div>
    </aside>
    <main class="main" id="main"><nav class="tabstrip" id="nav" aria-label="Screens"></nav><div class="viewhost" id="viewHost"></div></main>
    <aside class="guide" id="guide" hidden>
      <div class="resizer" id="guideResizer" title="Drag to resize"></div>
      <div class="guide-head" id="guideHead"><span class="label" style="flex:1">Help panel</span>
        <button class="icon-btn" id="dockLeft" title="Dock on the left" aria-label="Dock on the left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
        <button class="icon-btn" id="dockRight" title="Dock on the right" aria-label="Dock on the right"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
        <button class="icon-btn" id="dockFloat" title="Pop out as a floating window" aria-label="Pop out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="8" y="8" width="13" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg></button>
        <button class="icon-btn" id="guideClose" aria-label="Close helper" title="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="guide-tabs" role="tablist" id="guideTabs">
        <button role="tab" data-gt="guide" aria-selected="true">Guide</button>
        <button role="tab" data-gt="learn" aria-selected="false">Learn SQL</button>
        <button role="tab" data-gt="ai" aria-selected="false">AI assistant</button>
        <button role="tab" data-gt="words" aria-selected="false">Words</button>
      </div>
      <div class="guide-body" id="guideBody"></div>
    </aside>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="xtip" id="xtip" hidden></div>
